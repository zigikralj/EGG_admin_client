name: Version Bump & Release

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, closed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Precondition - Bump version on the PR branch (merging branch)
  # Runs while the PR is open / synchronized / labeled
  # Pushes the version bump commit directly to github.head_ref (NOT to main)
  # ------------------------------------------------------------------
  bump-pr-branch:
    name: Bump Version on PR Branch
    if: |
      (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref_name != 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch origin main
        run: |
          git fetch origin main --tags || true

      - name: Evaluate Version Bump
        id: check_bump
        run: |
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");

            const eventName = process.env.EVENT_NAME;
            const dispatchBump = process.env.DISPATCH_BUMP;
            const prTitle = process.env.PR_TITLE || "";
            const prNumber = process.env.PR_NUMBER || "";
            const prAuthor = process.env.PR_AUTHOR || "contributor";
            const prLabelsJson = process.env.PR_LABELS || "[]";

            let labels = [];
            try {
              labels = JSON.parse(prLabelsJson).map(l => (typeof l === "string" ? l : l.name).toLowerCase());
            } catch (e) {
              console.log("Error parsing labels:", e.message);
            }

            console.log("PR Labels:", labels);
            console.log("PR Title:", prTitle);

            // 1. Check for skip indicators (only in PR events)
            if (eventName === "pull_request") {
              if (
                labels.includes("no-release") ||
                labels.includes("skip-release") ||
                prTitle.toLowerCase().startsWith("chore(release)") ||
                prTitle.toLowerCase().includes("[skip release]") ||
                prTitle.toLowerCase().includes("[skip ci]")
              ) {
                console.log("Skipping version bump due to skip label or title marker.");
                fs.appendFileSync(process.env.GITHUB_OUTPUT, "should_bump=false\n");
                process.exit(0);
              }
            }

            // 2. Determine bump type
            let bumpType = "patch";
            if (eventName === "workflow_dispatch" && dispatchBump) {
              bumpType = dispatchBump;
            } else if (labels.includes("release:major") || labels.includes("major")) {
              bumpType = "major";
            } else if (labels.includes("release:minor") || labels.includes("minor")) {
              bumpType = "minor";
            } else if (labels.includes("release:patch") || labels.includes("patch")) {
              bumpType = "patch";
            } else {
              const title = prTitle.trim();
              if (title.includes("BREAKING CHANGE") || /^[a-z]+(\([^)]*\))?!:/.test(title)) {
                bumpType = "major";
              } else if (/^feat(\([^)]*\))?:/i.test(title)) {
                bumpType = "minor";
              } else {
                bumpType = "patch";
              }
            }
            console.log("Determined bump type:", bumpType);

            // 3. Helper functions for semver comparison
            function parseSemver(v) {
              if (!v) return [0, 0, 0];
              const clean = v.replace(/^v/, "");
              const parts = clean.split(".").map(Number);
              return [isNaN(parts[0]) ? 0 : parts[0], isNaN(parts[1]) ? 0 : parts[1], isNaN(parts[2]) ? 0 : parts[2]];
            }

            function semverCompare(a, b) {
              const [a1, a2, a3] = parseSemver(a);
              const [b1, b2, b3] = parseSemver(b);
              if (a1 !== b1) return a1 - b1;
              if (a2 !== b2) return a2 - b2;
              return a3 - b3;
            }

            // 4. Determine base version from origin/main and tags
            let mainVersion = "1.0.0";
            try {
              const mainPkg = JSON.parse(execSync("git show origin/main:package.json", { encoding: "utf8" }));
              mainVersion = (mainPkg.version || "1.0.0").replace(/^v/, "");
            } catch (e) {
              console.log("Could not read package.json from origin/main:", e.message);
            }

            let latestTag = "";
            try {
              const tags = execSync("git tag -l \"v*\" --sort=-v:refname", { encoding: "utf8" })
                .split("\n")
                .map(t => t.trim().replace(/^v/, ""))
                .filter(Boolean);
              if (tags.length > 0) {
                latestTag = tags[0];
              }
            } catch (e) {
              console.log("Could not read tags:", e.message);
            }

            const baseVersion = (latestTag && semverCompare(latestTag, mainVersion) > 0) ? latestTag : mainVersion;
            console.log("Base version from main/tags:", baseVersion);

            // 5. Calculate expected target version
            const [bMaj, bMin, bPat] = parseSemver(baseVersion);
            let tMaj = bMaj, tMin = bMin, tPat = bPat;
            if (bumpType === "major") {
              tMaj += 1;
              tMin = 0;
              tPat = 0;
            } else if (bumpType === "minor") {
              tMin += 1;
              tPat = 0;
            } else {
              tPat += 1;
            }
            const targetVersion = [tMaj, tMin, tPat].join(".");
            console.log("Calculated target version:", targetVersion);

            // 6. Check current branch version in package.json
            let currentBranchVersion = "";
            try {
              const prPkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              currentBranchVersion = (prPkg.version || "").replace(/^v/, "");
            } catch (e) {
              console.log("Could not read branch package.json:", e.message);
            }
            console.log("Current branch version:", currentBranchVersion);

            if (currentBranchVersion === targetVersion) {
              console.log("Branch is already at target version v" + targetVersion + ". Skipping bump.");
              fs.appendFileSync(process.env.GITHUB_OUTPUT, "should_bump=false\n");
              process.exit(0);
            }

            // If already bumped higher than main and matches/exceeds target, do not revert
            if (semverCompare(currentBranchVersion, baseVersion) > 0 && semverCompare(currentBranchVersion, targetVersion) >= 0) {
              console.log("Branch version (v" + currentBranchVersion + ") is already ahead of base (v" + baseVersion + "). Skipping bump.");
              fs.appendFileSync(process.env.GITHUB_OUTPUT, "should_bump=false\n");
              process.exit(0);
            }

            const prReference = prNumber ? " (#" + prNumber + ")" : "";
            const authorReference = prAuthor ? " by @" + prAuthor : "";
            const releaseNotes = "- " + (prTitle || "Release v" + targetVersion) + prReference + authorReference;

            fs.appendFileSync(process.env.GITHUB_OUTPUT, "should_bump=true\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "target_version=" + targetVersion + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "release_notes=" + releaseNotes + "\n");
          '
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BUMP: ${{ github.event.inputs.bump_type }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}

      - name: Apply Bump to PR Branch & Push
        if: steps.check_bump.outputs.should_bump == 'true'
        env:
          TARGET_VERSION: ${{ steps.check_bump.outputs.target_version }}
          RELEASE_NOTES: ${{ steps.check_bump.outputs.release_notes }}
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "Bumping version to v${TARGET_VERSION} on branch ${TARGET_BRANCH}..."

          # 1. Update package.json and package-lock.json
          npm version "${TARGET_VERSION}" --no-git-tag-version --allow-same-version

          # 2. Prepend release notes to CHANGELOG.md
          node -e '
            const fs = require("fs");
            const changelogPath = "CHANGELOG.md";
            const targetVersion = process.env.TARGET_VERSION;
            const releaseNotes = process.env.RELEASE_NOTES;
            const today = new Date().toISOString().split("T")[0];

            if (fs.existsSync(changelogPath)) {
              let content = fs.readFileSync(changelogPath, "utf8");
              const versionHeader = "## [v" + targetVersion + "]";
              if (!content.includes(versionHeader)) {
                const newEntry = "## [v" + targetVersion + "] - " + today + "\n\n" + releaseNotes + "\n\n";
                const marker = "All notable changes to this project will be documented in this file.\n\n";
                if (content.includes(marker)) {
                  content = content.replace(marker, marker + newEntry);
                } else {
                  content = "# Changelog\n\n" + newEntry + content.replace(/^# Changelog\n+/, "");
                }
                fs.writeFileSync(changelogPath, content);
                console.log("Updated CHANGELOG.md with v" + targetVersion);
              } else {
                console.log("CHANGELOG.md already has header for v" + targetVersion);
              }
            }
          '

          # 3. Commit and push directly to the PR branch (merging branch)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "${TARGET_BRANCH}"
          git add package.json package-lock.json CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore(release): bump version to v${TARGET_VERSION} [skip ci]"
          git push origin "${TARGET_BRANCH}"

          echo "### 🚀 Version Bump Applied to PR Branch" >> $GITHUB_STEP_SUMMARY
          echo "Updated \`package.json\`, \`package-lock.json\`, and \`CHANGELOG.md\` to **v${TARGET_VERSION}** on branch \`${TARGET_BRANCH}\`." >> $GITHUB_STEP_SUMMARY
          echo "When this PR is merged to \`main\`, version **v${TARGET_VERSION}** will land directly in \`main\` and publish release **v${TARGET_VERSION}** automatically." >> $GITHUB_STEP_SUMMARY

  # ------------------------------------------------------------------
  # JOB 2: Post-merge Tag & Release
  # Runs when the PR is merged into main (or manual dispatch on main)
  # Reads the already-bumped version from package.json on main
  # Creates git tag, GitHub Release, and triggers deployment
  # NEVER pushes commits to main (avoiding branch protection violations)
  # ------------------------------------------------------------------
  release-on-merge:
    name: Tag & Release on Merge
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read Version from package.json
        id: pkg_info
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const version = (pkg.version || "").replace(/^v/, "");
            console.log("Package version on main:", version);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "version=" + version + "\n");
          '

      - name: Check if Tag Already Exists
        id: tag_check
        run: |
          VERSION="${{ steps.pkg_info.outputs.version }}"
          if [ -z "$VERSION" ]; then
            echo "No version found in package.json. Skipping."
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists. Skipping release."
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag v${VERSION} does not exist yet. Ready for release."
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Git Tag and GitHub Release
        if: steps.tag_check.outputs.tag_exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pkg_info.outputs.version }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          TAG="v${VERSION}"
          PR_REF=""
          if [ -n "$PR_NUMBER" ]; then
            PR_REF=" (#${PR_NUMBER})"
          fi
          AUTHOR_REF=""
          if [ -n "$PR_AUTHOR" ]; then
            AUTHOR_REF=" by @${PR_AUTHOR}"
          fi
          TITLE="${PR_TITLE:-Release ${TAG}}"
          NOTES="- ${TITLE}${PR_REF}${AUTHOR_REF}"

          echo "Creating Git Tag ${TAG}..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}" || echo "Git tag push via CLI skipped or failed; GitHub Release API will create tag."

          echo "Creating GitHub Release ${TAG}..."
          gh release create "${TAG}" \
            --title "${TAG}" \
            --target main \
            --notes "${NOTES}" || echo "GitHub release creation skipped or already exists."

          echo "### 🎉 Release Published" >> $GITHUB_STEP_SUMMARY
          echo "Successfully published **${TAG}** to GitHub Releases!" >> $GITHUB_STEP_SUMMARY

      - name: Trigger Deployment
        if: steps.tag_check.outputs.tag_exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pkg_info.outputs.version }}
        run: |
          echo "Triggering deployment workflow for v${VERSION} on main..."
          gh workflow run deploy.yml --ref main -f version="v${VERSION}" || \
          gh workflow run deploy.yml --ref main || \
          echo "Deployment workflow dispatch completed or skipped."
